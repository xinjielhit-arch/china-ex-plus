<!doctype html>
<html lang=zh-Hans>
<head>
<meta charset=UTF-8>
<meta http-equiv=X-UA-Compatible content="IE=edge">
<meta name=viewport content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>全球制霸生成器·文本标记版</title>
<meta name=description content="全球部分国家地区制霸标记生成工具·支持文本快速标记与图片导入">
<style>
html{font:16px/1.6 'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;background-color:#BAE4FF;color:#111}
body{margin:0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
::selection{background-color:#FF7E7E}
a{color:#111;text-decoration:none}
svg{display:block;width:100%;height:100%;pointer-events:none}
svg a{pointer-events:auto}
#countrys>*{cursor:pointer;pointer-events:auto}
#countrys>*:hover{filter:brightness(.93)}
.按钮{display:inline-block;background:#FFF;border:0;box-shadow:0 0 0 3px #111,3px 3px 0 rgba(0,0,0,.15);border-radius:4px;cursor:pointer;font:600 15px/1 inherit;font-family:inherit;color:#111;padding:9px 16px}
.按钮:hover{filter:brightness(.94)}
.按钮.主{background:#FF7E7E}
.按钮.次{box-shadow:0 0 0 2px #111;border-radius:4px;padding:7px 12px;font-size:14px}
#设置等级{display:none;position:fixed;z-index:30;background:#FFF;width:128px;border:3px solid #000;border-radius:6px;overflow:hidden;text-align:center;box-shadow:3px 6px 0 rgba(0,0,0,.14)}
#设置等级 h2{margin:0;font-size:18px;font-weight:700;padding:6px 8px}
#设置等级 a{display:block;padding:5px 10px;font-size:14px;cursor:pointer}
#设置等级 a:hover{filter:brightness(.92)}
#设置等级 h2[data-level="5"],#设置等级 a[data-level="5"]{background:#FF7E7E}
#设置等级 h2[data-level="4"],#设置等级 a[data-level="4"]{background:#FFB57E}
#设置等级 h2[data-level="3"],#设置等级 a[data-level="3"]{background:#FFE57E}
#设置等级 h2[data-level="2"],#设置等级 a[data-level="2"]{background:#A8FFBE}
#设置等级 h2[data-level="1"],#设置等级 a[data-level="1"]{background:#88AEFF}
#设置等级 h2[data-level="w"],#设置等级 a[data-level="w"]{background:#edd1ff}
#地图区{flex:1;min-height:0;position:relative}
#面板{flex:none;background:#FFF;border-top:4px solid #000;display:flex;flex-direction:column}
#面板.收起{display:none}
#面板>header{display:flex;align-items:center;gap:8px;padding:6px 14px;background:#FF7E7E;border-bottom:3px solid #000;flex:none}
#面板>header h2{margin:0;font-size:15px}
#面板分数{font:700 14px/1 inherit;font-family:inherit;background:#FFF;border:2px solid #000;border-radius:6px;padding:4px 8px;margin-left:auto;white-space:nowrap}
#导航{font-size:13px;font-weight:700;margin-left:10px}
#导航 a{padding:2px 6px;border:2px solid #000;border-radius:5px;background:#FFF;margin-left:4px}
#面板>header button{background:#FFF;border:2px solid #000;border-radius:4px;cursor:pointer;font:600 12px/1 inherit;font-family:inherit;padding:4px 8px}
#面板 .主体{width:100%;max-width:800px;margin:0 auto;padding:8px 14px 12px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box}
textarea{width:100%;box-sizing:border-box;height:56px;resize:vertical;border:3px solid #000;border-radius:6px;padding:6px 10px;font:14px/1.6 inherit;font-family:inherit;background:#FDFDFD}
textarea:focus{outline:2px solid #FF7E7E}
.行{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#反馈{font-size:13px;min-height:22px}
.chip{padding:1px 9px;border:2px solid #000;border-radius:6px;font-size:12px;font-weight:700}
.注{margin:0;font-size:12px;color:#666}
#输出{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:#FFF;z-index:40;overflow:auto;-webkit-overflow-scrolling:touch;text-align:center;padding:24px 12px;box-sizing:border-box}
#输出 img{display:block;width:auto;height:auto;max-width:88vw;max-height:62vh;margin:0 auto;box-shadow:0 5px 20px rgba(0,0,0,.14);border:1px solid #ddd}
#输出 p{margin:12px 0}
#轻提示{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-14px);background:#111;color:#FFF;padding:9px 20px;border-radius:22px;font-size:14px;z-index:50;opacity:0;transition:.3s;pointer-events:none;max-width:80vw;box-sizing:border-box}
#轻提示.显示{opacity:1;transform:translateX(-50%) translateY(0)}
#浮钮{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:none;z-index:15}
#浮钮.显示{display:inline-block}
@media (max-width:640px){
  .按钮{padding:7px 12px;font-size:14px}
  #面板 .主体{padding:8px 10px 10px}
  textarea{height:60px}
}
</style>
</head>

<script>
(()=>{

const $=s=>document.querySelector(s);
const 等级色={5:'#FF7E7E',4:'#FFB57E',3:'#FFE57E',2:'#A8FFBE',1:'#88AEFF',w:'#EDD1FF',0:'#FFFFFF'};
const 等级名={5:'居住',4:'短居',3:'游玩',2:'出差',1:'路过',w:'想要去',0:'没去过'};

/* ============ 状态（与原版 localStorage 'world-ex-levels' 兼容） ============ */

/* ============ 点击国家弹窗（原版交互） ============ */

/* ============ 别名（含拼音）→ 国家 ============ */
const 别名={
'阿联酋':'阿拉伯联合酋长国','迪拜':'阿拉伯联合酋长国','澳大利亚':'澳洲','俄国':'俄罗斯','美利坚':'美国','usa':'美国','us':'美国','america':'美国','uk':'英国','england':'英国','britain':'英国','japan':'日本','korea':'韩国','南韩':'韩国','南朝鲜':'韩国','北朝鲜':'朝鲜','germany':'德国','france':'法国','italy':'意大利','spain':'西班牙','portugal':'葡萄牙','netherlands':'荷兰','holland':'荷兰','belgium':'比利时','switzerland':'瑞士','austria':'奥地利','greece':'希腊','turkey':'土耳其','russia':'俄罗斯','india':'印度','thailand':'泰国','vietnam':'越南','malaysia':'马来西亚','indonesia':'印度尼西亚','philippines':'菲律宾','singapore':'新加坡','sg':'新加坡','egypt':'埃及','canada':'加拿大','brazil':'巴西','argentina':'阿根廷','mexico':'墨西哥','cuba':'古巴','peru':'秘鲁','chile':'智利','nz':'新西兰','new zealand':'新西兰','au':'澳洲','australia':'澳洲','iceland':'冰岛','norway':'挪威','finland':'芬兰','sweden':'瑞典','denmark':'丹麦','ireland':'爱尔兰','poland':'波兰','czech':'捷克','hungary':'匈牙利','romania':'罗马里亚','bulgaria':'保加利亚','ukraine':'乌克兰','iran':'伊朗','iraq':'伊拉克','saudi':'沙特阿拉伯','沙特':'沙特阿拉伯','qatar':'卡塔尔','israel':'以色列','mongolia':'蒙古','nepal':'尼泊尔','pakistan':'巴基斯坦','sri lanka':'斯里兰卡','maldives':'马尔代夫','bhutan':'不丹','bangladesh':'孟加拉国','myanmar':'缅甸','cambodia':'柬埔寨','laos':'老挝','kazakhstan':'哈萨克','uzbekistan':'乌兹别克斯坦','georgia':'格鲁吉亚','armenia':'亚美尼亚','azerbaijan':'阿塞拜疆','ethiopia':'埃塞俄比亚','kenya':'肯尼亚','tanzania':'坦桑尼亚','madagascar':'马达加斯加岛','morocco':'摩洛哥','tunisia':'突尼斯','algeria':'阿尔及利亚','libya':'利比亚','sudan':'苏丹','greenland':'格陵兰岛','fiji':'斐济','hawaii':'美·夏威夷','夏威夷':'美·夏威夷','波黑':'波赫','罗马尼亚':'罗马里亚','乍得':'查得','莫桑比克':'莫桑比亚','刚果金':'刚果民主共和国','刚果（布）':'刚果','土库曼斯坦':'土库曼','哈萨克斯坦':'哈萨克','梵蒂冈':'梵蒂冈','南极洲':'南极','hong kong':'中国','台湾':'中国','taiwan':'中国','tibet':'中国','西藏':'中国','香港':'中国','澳门':'中国'
};

/* 行为词 + 想去(w) + 否定词 */
const 行为词=[
[5,['居住','生活','定居','工作','读书','上学','长大','出生','老家','家乡','待过','呆过','住']],
[4,['短居','短住','旅居','支教','实习']],
[3,['游玩','旅游','旅行','度假','打卡','去过','入住','玩','游']],
[2,['出差','差旅','公干']],
[1,['路过','经过','转机','中转','途经','换乘']]
];
const 想去词=['想去','想要去','想游','想逛','种草','计划','打算','准备','下次','以后','将来','梦想'];
const 否定词=['没去过','没到过','没来过','没去','没到','没来','没游','没逛','没玩','没机','没时','没空','未能','尚未','还没','从未','不曾','从没'];

/* ============ 解析：全文就近配对，兼容语音 ============ */
function 解析(raw){
  const 结果={};
  const t=(''+raw).toLowerCase()
    .replace(/[\uff01-\uff5e]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xfee0)).replace(/\u3000/g,' ')
    .replace(/[\r\n\t、，,;；。．.！!？?]+/g,' ');
  const 案=[];
  shapes.forEach(p=>案.push({kw:p.id,rs:[p.id]}));
  for(const a in 别名)案.push({kw:a,rs:[别名[a]]});
  案.sort((a,b)=>b.kw.length-a.kw.length);
  const 占=[];const 占用=(s,e)=>占.some(([a,b])=>s<b&&e>a);
  const 命中=[];
  for(const p of 案){
    let i=t.indexOf(p.kw);
    while(i!==-1){
      const e=i+p.kw.length;
      if(!占用(i,e)){占.push([i,e]);命中.push({s:i,e,rs:p.rs});}
      i=t.indexOf(p.kw,i+1);
    }
  }
  const 扫=(词,lv)=>{
    const 池=[];
    for(const k of 词){
      let i=t.indexOf(k);
      while(i!==-1){池.push({s:i,e:i+k.length,lv});i=t.indexOf(k,i+1);}
    }
    return 池;
  };
  const 标准池=[];
  for(const[lv,词]of 行为词)for(const h of 扫(词,lv))标准池.push(h);
  const 想池=扫(想去词,'w');
  const 考=(池,W,向后,地)=>{
    let best=null;
    for(const h of 池){
      if(向后){if(h.s<地.e)continue;}else{if(h.e>地.s)continue;}
      const d=向后?h.s-地.e:地.s-h.e;
      if(d<=W&&(!best||d<best.d||(d===best.d&&String(h.lv)>String(best.lv))))best={lv:h.lv,d};
    }
    return best;
  };
  let 忽略=0,想去数=0;
  for(const 待 of 命中){
    const 窗起=Math.max(0,待.s-6);
    const 前=t.slice(窗起,待.s);
    const 后=t.slice(待.e,待.e+3);
    const 邻否=k=>{
      const i=前.lastIndexOf(k);
      if(i<0)return false;
      const 否起=窗起+i,否尾=窗起+i+k.length;
      if(命中.some(m=>m!==待&&m.e>=否起-1&&m.e<=否起+1))return false;
      return !命中.some(m=>m!==待&&m.s>=否尾&&m.e<=待.s);
    };
    if(否定词.some(邻否)||/^[没未]/.test(后)||后.includes('没去')||后.includes('没到')){
      /* 否定但伴随「想去」→ 标记为想要去 */
      const 伴=想去词.some(k=>前.includes(k)||后.includes(k)||t.slice(待.e,待.e+8).includes(k));
      if(伴){待.rs.forEach(r=>{结果[r]='w'});想去数++;continue;}
      忽略++;continue;
    }
    const 准后=考(标准池,5,true,待);
    const 想后=准后?null:考(想池,5,true,待);
    const 准前=(准后||想后)?null:考(标准池,5,false,待);
    const hit=准后||想后||准前;
    if(想后)想去数++;
    const lv=hit?hit.lv:3;
    const 合=(a,b)=>{
      if(a===undefined)return b;
      if(a==='w')return b;
      if(b==='w')return a;
      return String(Math.max(+a,+b));
    };
    待.rs.forEach(r=>{结果[r]=合(结果[r],lv)});
  }
  return{结果,忽略,想去数};
}

/* ============ 面板 ============ */
const 输入=$('#输入'),反馈=$('#反馈');
const 示例='日本居住，泰国游玩，美国出差，澳大利亚想去，迪拜路过，德国法国短居';
function 轻提示(msg){
  const t=$('#轻提示');t.textContent=msg;t.classList.add('显示');
  clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('显示'),2200);
}
function 等级值(l){return l==='w'?'w':+l}
function 标记(解){
  const{结果,忽略,想去数}=解;
  const es=Object.entries(结果);
  反馈.innerHTML='';
  if(!es.length){
    反馈.innerHTML=忽略
      ?`<span class="注">识别到 ${忽略} 处提及，但均为「没去过」等，未标记</span>`
      :'<span class="注">没认出地点 · 例：日本居住，泰国游玩（别名/拼音均可）</span>';
    return 0;
  }
  const 计={'5':0,'4':0,'3':0,'2':0,'1':0,'w':0};
  es.forEach(([,l])=>计[l]++);
  const 总=document.createElement('span');
  总.style.cssText='font-weight:700;font-size:13px';
  总.textContent=`已标记 ${es.length} 国 · 居${计['5']} 短${计['4']} 游${计['3']} 差${计['2']} 过${计['1']} 想去${计['w']}`+(忽略?` · 忽略${忽略}处`:'');
  反馈.appendChild(总);
  const 序={'5':0,'w':1,'4':2,'3':3,'2':4,'1':5};
  es.sort((a,b)=>序[a[1]]-序[b[1]]).forEach(([s,l])=>{
    const c=document.createElement('span');c.className='chip';
    c.textContent=s;c.style.background=等级色[l];c.title=等级名[l];
    反馈.appendChild(c);
  });
  es.forEach(([s,l])=>{const i=shapes.findIndex(p=>p.id===s);if(i>=0)S[i]=l;});
  刷新();
  return es.length;
}
$('#解析钮').onclick=()=>{

$('#示例钮').onclick=()=>{输入.value=示例;轻提示('已填入示例，点「标记到地图」试试');};
$('#清空钮').onclick=()=>{输入.value='';反馈.innerHTML='<span class="注">国家 + 行为词，逗号/空格分隔 · 点国家可手动标记</span>';};
$('#收起面板').onclick=()=>{$('#面板').classList.add('收起');$('#浮钮').classList.add('显示');};
$('#浮钮').onclick=()=>{$('#面板').classList.remove('收起');$('#浮钮').classList.remove('显示');};
$('#重置').onclick=()=>{
  if(confirm('确定清空所有标记？')){S=Array(shapes.length).fill('0');刷新();轻提示('已重置');}
};

if(视口){

/* ============ 📷 导入图片：海洋底定位 + 网格采样分级 ============ */
$('#导入钮').onclick=()=>$('#图片框').click();
$('#图片框').onchange=e=>{
  const f=e.target.files[0];
  e.target.value='';
  if(!f)return;
  /* 优先 ImageBitmap：按 EXIF 方向解码，手机拍照导入不会旋转 */
  if(window.createImageBitmap){
    createImageBitmap(f,{imageOrientation:'from-image'})
      .then(bp=>{图片导入(bp);if(bp.close)bp.close();})
      .catch(()=>用Image导入(f));
  }else 用Image导入(f);
};
const 用Image导入=f=>{
  const img=new Image();
  img.onload=()=>{图片导入(img);URL.revokeObjectURL(img.src);};
  img.onerror=()=>轻提示('图片读取失败');
  img.src=URL.createObjectURL(f);
};
function 图片导入(img){
  const cv=document.createElement('canvas');
  const 比=Math.min(1,2400/Math.max(img.width,img.height));
  cv.width=Math.round(img.width*比);cv.height=Math.round(img.height*比);
  const cx=cv.getContext('2d');
  cx.drawImage(img,0,0,cv.width,cv.height);
  const 像=cx.getImageData(0,0,cv.width,cv.height);
  const 色=(x,y)=>{
    x=Math.max(0,Math.min(cv.width-1,Math.round(x)));y=Math.max(0,Math.min(cv.height-1,Math.round(y)));
    const i=(y*cv.width+x)*4;
    return [像.data[i],像.data[i+1],像.data[i+2]];
  };
  /* 海洋蓝 #BAE4FF 包围盒 */
  let x0=1e9,y0=1e9,x1=-1,y1=-1;
  for(let y=0;y<cv.height;y+=2)for(let x=0;x<cv.width;x+=2){
    const[r,g,b]=色(x,y);
    if(Math.abs(r-186)<38&&Math.abs(g-228)<30&&Math.abs(b-255)<26){
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
    }
  }
  if(x1-x0<60){轻提示('未找到地图区域，请上传完整生成图');return;}
  /* 深色行列直方图 → 最长连续段 = 地图范围（排除分数等孤立文字） */
  const 行暗=Array(cv.height).fill(0),列暗=Array(cv.width).fill(0);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const[r,g,b]=色(x,y);
    if(r<110&&g<110&&b<110){行暗[y]++;列暗[x]++;}
  }
  const 最长段=(暗)=>{
    let best=[0,0],s=-1;
    for(let i=0;i<暗.length;i++){
      if(暗[i]>0){if(s<0)s=i;}
      else{if(s>=0&&i-s>best[1]-best[0])best=[s,i];s=-1;}
    }
    if(s>=0&&暗.length-s>best[1]-best[0])best=[s,暗.length];
    return best;
  };
  const[my0,my1]=最长段(行暗);
  const[mx0,mx1]=最长段(列暗);
  if(mx1-mx0<60||my1-my0<60){轻提示('未识别到地图边界，请换更完整的图');return;}
  /* 地图内容在 viewBox 中的范围（运行时由各国 bbox 求并集） */
  let vx0=1e9,vy0=1e9,vx1=-1,vy1=-1;
  shapes.forEach(p=>{
    const b=p.getBBox();
    vx0=Math.min(vx0,b.x);vy0=Math.min(vy0,b.y);
    vx1=Math.max(vx1,b.x+b.width);vy1=Math.max(vy1,b.y+b.height);
  });
  const 映射=(x,y)=>[mx0+(x-vx0)/(vx1-vx0)*(mx1-mx0),my0+(y-vy0)/(vy1-vy0)*(my1-my0)];
  const 基=[['#FF7E7E','5'],['#FFB57E','4'],['#FFE57E','3'],['#A8FFBE','2'],['#88AEFF','1'],['#EDD1FF','w'],['#FFFFFF','0'],['#BAE4FF','海'],['#000000','黑']].map(([h,l])=>{
    const n=parseInt(h.slice(1),16);
    return [n>>16,n>>8&255,n&255,l];
  });
  const 分类=(r,g,b)=>{
    if(r<110&&g<110&&b<110)return '黑';
    if(Math.abs(r-186)<45&&Math.abs(g-228)<40&&Math.abs(b-255)<30)return '海';
    const 距=基.slice(0,7).map(([R,G,B,l])=>({l,d:Math.sqrt((r-R)**2+(g-G)**2+(b-B)**2)})).sort((a,b2)=>a.d-b2.d);
    /* 纯色距离近 0；边缘抗锯齿混色与多个候选都相近 → 弃权 */
    if(距[0].d<38&&距[1].d-距[0].d>22)return 距[0].l;
    return '杂';
  };
  const svg=document.querySelector('svg');
  const 造点=(x,y)=>{const p=svg.createSVGPoint();p.x=x;p.y=y;return p;};
  /* 地名文字包围盒：这些点不采样（文字内部多为白色，会污染分级） */
  const 字盒=[...svg.querySelectorAll('text')].map(tx=>tx.getBBox());
  const 在字=(x,y)=>字盒.some(b=>x>=b.x-1&&x<=b.x+b.width+1&&y>=b.y-1&&y<=b.y+b.height+1);
  const 盒=shapes.map(p=>p.getBBox());
  const 独占=(vx,vy,i,pt)=>{
    for(let j=0;j<盒.length;j++){
      if(j===i)continue;
      const b=盒[j];
      if(vx<b.x||vx>b.x+b.width||vy<b.y||vy>b.y+b.height)continue;
      let 在=false;
      try{在=shapes[j].isPointInFill(pt);}catch(e){在=false;}
      if(在)return false;/* 该点被其他国家（视觉上层）覆盖 */
    }
    return true;
  };
  const sx=(mx1-mx0)/(vx1-vx0),sy=(my1-my0)/(vy1-vy0);
  let 成=0,败=0;
  shapes.forEach((p,i)=>{
    const b=盒[i];
    if(b.width*sx<8||b.height*sy<8){败++;return;}
    /* 只采样：落在国家形状内 + 不在文字上 + 不被其他国家覆盖 */
    const 在内=[];
    for(let gy=1;gy<=6&&在内.length<16;gy++)for(let gx=1;gx<=6&&在内.length<16;gx++){
      const vx=b.x+b.width*gx/7,vy=b.y+b.height*gy/7;
      if(在字(vx,vy))continue;
      let 在=false;
      try{在=p.isPointInFill(造点(vx,vy));}catch(e){在=false;}
      if(在&&独占(vx,vy,i,造点(vx,vy)))在内.push([vx,vy]);
    }
    if(在内.length<3){败++;return;}
    const 票={};let 有效=0;
    for(const[vx,vy]of 在内){
      const px=mx0+(vx-vx0)*sx,py=my0+(vy-vy0)*sy;
      const[r,g,bl]=色(px,py);
      const k=分类(r,g,bl);
      if(k!=='海'&&k!=='黑'&&k!=='杂'){票[k]=(票[k]||0)+1;有效++;}
    }
    const 项=Object.entries(票).sort((a,b2)=>b2[1]-a[1])[0];
    if(项&&项[1]>=3&&项[1]*2>=有效){S[i]=项[0];成++;}
    else 败++;
  });
  刷新();
  轻提示(`导入完成：识别 ${成} 国`+(败?` · ${败} 处未识别（保持原标记）`:''));
}

/* ============ 保存成图片（2000×2000 蓝底，移动端兼容） ============ */
const 输出=$('#输出'),输出图=输出.querySelector('img');
$('#保存').onclick=async()=>{
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  document.documentElement.style.height='';
  try{await document.fonts.load('12px slice');}catch(e){}
  /* 形状层：克隆 SVG 并剥离全部 <text>（iOS 光栅化 SVG 图片不加载字体，文本会整段消失） */
  const 克隆=document.querySelector('svg').cloneNode(true);
  克隆.querySelectorAll('text').forEach(t=>t.remove());
  克隆.setAttribute('width','2000');克隆.setAttribute('height','1210');
  const 源='<?xml version="1.0" encoding="utf-8"?>'+克隆.outerHTML;
  const url=URL.createObjectURL(new Blob([源],{type:'image/svg+xml;charset=utf-8'}));
  const img=new Image();
  try{
    await new Promise((ok,bad)=>{img.onload=ok;img.onerror=bad;img.src=url;});
    if(img.decode){try{await img.decode();}catch(e){}}
  }catch(e){轻提示('图片生成失败，请重试');return;}
  const E=1.5,W=2000*E,H=2000*E;
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#BAE4FF';ctx.fillRect(0,0,W,H);
  ctx.drawImage(img,0,0,2000,1210,0,Math.round(395*E),W,1210*E);
  /* 文本层：用文档已加载的 slice 字体逐个 fillText（不依赖 SVG 图片的字体渲染，iOS/桌面一致） */
  const 偏移=Math.round(395*E);
  document.querySelectorAll('svg text').forEach(t=>{
    const cs=getComputedStyle(t);
    const fs=parseFloat(cs.fontSize)||12;
    const x=parseFloat(t.getAttribute('x')),y=parseFloat(t.getAttribute('y'));
    if(!isFinite(x)||!isFinite(y))return;
    ctx.font=fs*E+'px slice,sans-serif';
    ctx.fillStyle=(cs.fill&&cs.fill!=='none')?cs.fill:'#000';
    const 锚=t.getAttribute('text-anchor');
    ctx.textAlign=锚==='middle'?'center':锚==='end'?'end':'left';
    ctx.textBaseline='alphabetic';
    ctx.fillText(t.textContent,x*E,偏移+y*E);
  });
  c.toBlob(b=>{
    if(!b){轻提示('图片生成失败，请重试');return;}
    const u=URL.createObjectURL(b);
    输出图.onload=()=>{输出.style.display='block';};
    输出图.src=u;$('#下载').href=u;
  },'image/png');
};
$('#关闭输出').onclick=()=>输出.style.display='none';
})();
</script>
